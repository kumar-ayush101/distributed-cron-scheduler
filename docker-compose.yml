# Local multi-node cluster for development and demos.
#
#   docker compose up --build                 # 1 api node + 2 workers + db + redis
#   docker compose up --build --scale worker=3 # scale workers horizontally
#
# The "api" node serves the dashboard + REST API on http://localhost:8080.
# Worker nodes run only the scheduler loop (SERVE_FRONTEND=false) and compete
# for job locks via Redis, demonstrating exactly-once execution.

services:
  db:
    image: postgres:15-alpine
    container_name: cron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cron
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cron
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cron"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cron-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: cron-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://cron:secret@db:5432/cron?sslmode=disable
      REDIS_URL: redis://redis:6379
      SERVE_FRONTEND: "true"
      SEED_DATA: "true"
      NODE_ID: api-node

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://cron:secret@db:5432/cron?sslmode=disable
      REDIS_URL: redis://redis:6379
      SERVE_FRONTEND: "false"
      SEED_DATA: "false"
    deploy:
      replicas: 2

volumes:
  postgres-data:
